<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World God Simulator II</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{
  --bg:rgba(13,17,23,0.90);--bg2:rgba(20,26,34,0.96);--bd:rgba(255,255,255,0.09);--bd2:rgba(255,255,255,0.18);
  --tx:#cfd8e3;--tx2:#8a96a6;--ac:#5aa9e6;--ac2:#3d7fb5;--warn:#e6a35a;--bad:#e65a5a;--good:#6cc48a;
  --mono:ui-monospace,Menlo,Consolas,monospace;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070b;color:var(--tx);font-family:var(--font);font-size:12.5px;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
canvas#world{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
.panel{position:fixed;background:var(--bg);border:1px solid var(--bd);border-radius:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:10;transition:transform .25s ease,opacity .2s ease}
.ph{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--bd);font-weight:600;letter-spacing:.08em;font-size:11px;text-transform:uppercase;color:#e6edf5;flex-shrink:0}
.ph button{color:var(--tx2);font-size:15px;line-height:1;padding:0 4px}.ph button:hover{color:#fff}
.hidden{display:none!important}
/* Top bar */
#topbar{position:fixed;top:0;left:0;right:0;height:42px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:8px;z-index:30;font-size:12px}
#topbar .brand{font-weight:700;letter-spacing:.14em;font-size:12px;color:#fff;padding-right:12px;border-right:1px solid var(--bd);white-space:nowrap}
#topbar .brand span{color:var(--ac)}
#dateBox{display:flex;gap:12px;font-family:var(--mono);color:#e6edf5;padding:0 4px;white-space:nowrap}
#dateBox b{color:var(--ac);font-weight:600}
.tbtn{padding:5px 8px;border:1px solid var(--bd);border-radius:4px;background:rgba(255,255,255,.03);color:var(--tx);font-size:11.5px;line-height:1;white-space:nowrap;transition:background .12s,border-color .12s}
.tbtn:hover{background:rgba(255,255,255,.09);border-color:var(--bd2)}
.tbtn.on{background:rgba(90,169,230,.22);border-color:var(--ac);color:#fff}
.tbtn.danger:hover{background:rgba(230,90,90,.25);border-color:var(--bad)}
.spacer{flex:1}
#perfStats{position:fixed;right:8px;bottom:186px;z-index:60;display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--tx2);background:rgba(10,14,20,.72);border:1px solid var(--bd);border-radius:4px;padding:4px 8px;white-space:nowrap;cursor:default;backdrop-filter:blur(10px)}
body.fp #perfStats,body.view3d #perfStats{bottom:8px}
#perfStats b{color:#e6edf5;font-weight:600}
#perfStats .ok{color:var(--good)}#perfStats .warn{color:var(--warn)}#perfStats .bad{color:var(--bad)}
.speedbar{display:flex;gap:3px;align-items:center}
.speedbar .tbtn{padding:5px 7px;font-family:var(--mono)}
/* Toolbar */
#toolbar{position:fixed;top:50px;left:8px;bottom:186px;width:46px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;padding:4px 0;gap:2px;z-index:20;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tool{width:36px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx);position:relative;flex-shrink:0;transition:background .12s}
.tool:hover{background:rgba(255,255,255,.09)}
.tool.on{background:rgba(90,169,230,.28);box-shadow:inset 0 0 0 1px var(--ac);color:#fff}
.tool.sep{height:1px;width:28px;background:var(--bd);margin:3px 0;pointer-events:none}
.tool .k{position:absolute;right:3px;bottom:1px;font-size:8px;color:var(--tx2);font-family:var(--mono)}
/* Tool panel */
#toolpanel{top:50px;left:60px;bottom:186px;width:296px}
#toolpanel.collapsed{transform:translateX(-120%);opacity:0;pointer-events:none}
#tpBody{padding:10px;flex:1}
/* Right panel */
#rightpanel{top:50px;right:8px;bottom:186px;width:300px}
#rightpanel.collapsed{transform:translateX(115%);opacity:0;pointer-events:none}
#rpTabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
#rpTabs button{flex:1;padding:8px 2px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);border-bottom:2px solid transparent}
#rpTabs button.on{color:#fff;border-bottom-color:var(--ac)}
#rpBody{padding:10px;flex:1}
#rpToggle,#tpToggle,#bbToggle{position:fixed;z-index:25;width:22px;height:44px;background:var(--bg2);border:1px solid var(--bd);color:var(--tx2);border-radius:4px;font-size:12px}
#rpToggle{right:8px;top:50%;margin-top:-22px}
#tpToggle{left:60px;top:50%;margin-top:-22px}
#bbToggle{left:50%;bottom:186px;margin-left:-22px;width:44px;height:16px;font-size:9px;border-radius:4px 4px 0 0;border-bottom:none}
/* Bottom bar */
#bottombar{position:fixed;left:8px;right:8px;bottom:8px;height:170px;display:flex;gap:8px;z-index:20;transition:transform .25s ease,opacity .2s}
#bottombar.collapsed{transform:translateY(120%);opacity:0;pointer-events:none}
#bottombar>div{background:var(--bg);border:1px solid var(--bd);border-radius:6px;backdrop-filter:blur(10px);display:flex;flex-direction:column;min-width:0}
#eventLogWrap{flex:1.3}#eventLog{flex:1;padding:6px 8px;font-family:var(--mono);font-size:11px;line-height:1.5}
#eventLog .ev{padding:2px 4px;border-radius:3px;cursor:pointer;display:flex;gap:8px;color:var(--tx)}
#eventLog .ev:hover{background:rgba(255,255,255,.07)}
#eventLog .ev .y{color:var(--ac);min-width:62px}
#eventLog .ev.war{color:#f0a0a0}#eventLog .ev.dis{color:#f0c080}#eventLog .ev.civ{color:#a0d8ff}#eventLog .ev.eco{color:#a8e0a8}#eventLog .ev.tech{color:#d8c0ff}
#minimapWrap{width:230px;align-items:center;justify-content:center;padding:6px}
#minimap{border:1px solid var(--bd2);cursor:pointer;image-rendering:pixelated;max-width:100%;max-height:100%}
#statsWrap{flex:1}
#quickStats{flex:1;padding:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;font-size:11px;align-content:start}
#quickStats div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
#quickStats span{font-family:var(--mono);color:#e6edf5}
/* Widgets */
.sec{margin-bottom:12px}
.sec h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin:6px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sec h4.tog{cursor:pointer}.sec h4.tog::after{content:'▾';font-size:10px}.sec.closed h4.tog::after{content:'▸'}.sec.closed .secb{display:none}
.hint{font-size:11px;color:var(--tx2);line-height:1.45;margin-bottom:8px}
.sl{display:flex;flex-direction:column;margin-bottom:6px}
.sl label{display:flex;justify-content:space-between;font-size:11px;color:var(--tx);margin-bottom:2px}
.sl label span{font-family:var(--mono);color:var(--ac)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.14);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ac);margin-top:-4px;border:1px solid #fff3}
input[type=range]::-moz-range-track{height:4px;background:rgba(255,255,255,.14);border-radius:2px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ac);border:1px solid #fff3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gb{padding:6px 6px;border:1px solid var(--bd);border-radius:4px;background:rgba(255,255,255,.03);font-size:11px;text-align:left;display:flex;align-items:center;gap:6px;line-height:1.2;transition:background .1s;color:var(--tx)}
.gb:hover{background:rgba(255,255,255,.08)}
.gb.on{background:rgba(90,169,230,.22);border-color:var(--ac);color:#fff}
.gb .ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.gb.wide{grid-column:1/-1}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row>*{flex:1}
input[type=text],select,input[type=number]{width:100%;padding:5px 7px;background:rgba(0,0,0,.35);border:1px solid var(--bd2);border-radius:4px;color:#fff;font:inherit;outline:none}
select option{background:#151b23}
.btn{padding:7px 10px;border:1px solid var(--bd2);border-radius:4px;background:rgba(255,255,255,.05);color:#fff;font-size:11.5px;letter-spacing:.04em;text-align:center;transition:background .12s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.pri{background:rgba(90,169,230,.3);border-color:var(--ac)}.btn.pri:hover{background:rgba(90,169,230,.45)}
.btn.danger{background:rgba(230,90,90,.18);border-color:rgba(230,90,90,.5)}.btn.danger:hover{background:rgba(230,90,90,.35)}
.btn.sm{padding:4px 7px;font-size:10.5px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11.5px}
.sw{width:32px;height:16px;border-radius:8px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;transition:background .15s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#aab;transition:left .15s,background .15s}
.sw.on{background:var(--ac2)}.sw.on::after{left:18px;background:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px}
.kv div:nth-child(odd){color:var(--tx2)}.kv div:nth-child(even){font-family:var(--mono);color:#e6edf5;text-align:right}
.bar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin:2px 0 4px}.bar i{display:block;height:100%;background:var(--ac)}
.title{font-size:15px;font-weight:600;color:#fff;margin-bottom:2px}
.sub{font-size:11px;color:var(--tx2);margin-bottom:8px}
.swatch{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;gap:3px}
.li{padding:6px 8px;border:1px solid var(--bd);border-radius:4px;background:rgba(255,255,255,.03);font-size:11.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.li:hover{background:rgba(255,255,255,.07)}.li.on{border-color:var(--ac)}
.li .n{flex:1;color:#fff}.li .m{font-family:var(--mono);color:var(--tx2);font-size:10.5px}
.badge{font-size:9.5px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.1);color:#fff;letter-spacing:.04em}
.search{margin-bottom:6px}
/* Notifications */
#notifications{position:fixed;top:50px;right:316px;width:280px;display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none}
.note{pointer-events:auto;background:var(--bg2);border:1px solid var(--bd2);border-left:3px solid var(--ac);border-radius:4px;padding:7px 10px;font-size:11.5px;display:flex;gap:8px;align-items:flex-start;animation:slidein .25s ease;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer}
.note.dis{border-left-color:var(--warn)}.note.war{border-left-color:var(--bad)}.note.eco{border-left-color:var(--good)}.note.tech{border-left-color:#b08cff}
.note .x{color:var(--tx2);font-size:14px;line-height:1}.note .t{flex:1;line-height:1.35}.note .t b{color:#fff;display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1px}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
/* Tooltip */
#tooltip{position:fixed;background:#0c1016;border:1px solid var(--bd2);color:#fff;padding:5px 8px;font-size:11px;border-radius:4px;pointer-events:none;z-index:100;display:none;max-width:240px;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.5)}
#tooltip small{color:var(--tx2);display:block}
/* Climate charts */
.climcv{touch-action:none;user-select:none;-webkit-user-select:none}
.climrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.climrow .gb{flex:1 1 28%;justify-content:center;text-align:center}.climrow .btn{flex:1 1 28%}
@media (min-width:1101px){body.climtab #rightpanel{width:352px}body.climtab #notifications{right:368px}}
#hoverInfo{position:fixed;bottom:186px;left:60px;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;padding:4px 8px;font-family:var(--mono);font-size:10.5px;color:var(--tx2);z-index:15;pointer-events:none;white-space:nowrap}
/* Dev */
#devpanel{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid var(--bd2);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:#9f9;z-index:50;white-space:pre;line-height:1.4}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modalBox{width:min(560px,94vw);max-height:88vh;background:var(--bg2);border:1px solid var(--bd2);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modalBody{padding:14px;flex:1}
#modalBody .grid{grid-template-columns:repeat(2,1fr);gap:4px 16px}
.mfoot{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
/* Title & loading */
#titleScreen{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#12203a 0%,#070a12 65%);text-align:center}
#titleScreen h1{font-size:clamp(38px,8vw,84px);line-height:.95;letter-spacing:.18em;font-weight:800;color:#fff;text-shadow:0 0 40px rgba(90,169,230,.45)}
#titleScreen h1 span{display:block}#titleScreen h1 .g{color:var(--ac)}
#titleScreen .tag{margin:18px 0 34px;letter-spacing:.35em;color:var(--tx2);font-size:12px}
#titleScreen .menu{display:flex;flex-direction:column;gap:10px;width:260px}
#titleScreen .menu .btn{padding:12px;font-size:13px;letter-spacing:.14em}
#titleScreen .foot{position:absolute;bottom:22px;font-family:var(--mono);color:var(--tx2);font-size:11px;display:flex;gap:10px;align-items:center}
#titleScreen .foot input{width:90px;background:rgba(0,0,0,.4);border:1px solid var(--bd2);color:#fff;padding:3px 6px;border-radius:3px;font-family:var(--mono)}
#titleStars{position:absolute;inset:0;z-index:-1}
#loading{position:fixed;inset:0;z-index:190;background:rgba(5,7,11,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;letter-spacing:.3em;font-size:15px;color:#fff}
#loadMsg{margin-top:12px;font-size:11px;color:var(--tx2);letter-spacing:.1em;font-family:var(--mono)}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Responsive */
@media (max-width:1100px){#rightpanel{width:250px}#toolpanel{width:250px}#notifications{right:266px;width:220px}}
@media (max-width:860px){
  #toolbar{top:auto;bottom:8px;left:8px;right:8px;width:auto;height:46px;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 4px}
  .tool.sep{width:1px;height:28px;margin:0 3px}
  #toolpanel{left:8px;right:8px;width:auto;top:50px;bottom:62px}
  #rightpanel{left:8px;right:8px;width:auto;top:50px;bottom:62px}
  #bottombar{display:none}#bbToggle{display:none}#hoverInfo{display:none}
  #tpToggle{left:auto;right:36px;top:48px;height:22px;width:26px;margin:0}#rpToggle{top:48px;height:22px;width:26px;margin:0}
  #notifications{right:8px;left:8px;width:auto;top:76px}
  #topbar .brand{display:none}#dateBox{font-size:11px;gap:8px}
}
/* ---- v2 additions ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;display:none}
#fp{position:fixed;inset:0;width:100%;height:100%;z-index:45;display:none;cursor:crosshair}
#fphud{position:fixed;inset:0;z-index:46;pointer-events:none;display:none}
#fpui{display:none}
#fpPrompt{position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:47;background:rgba(10,14,20,.82);border:1px solid var(--bd2);padding:8px 16px;border-radius:6px;pointer-events:none;color:#fff;font-size:13px;letter-spacing:.04em}
#fpDialog{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);width:min(520px,90vw);z-index:47;background:rgba(14,18,26,.93);border:1px solid var(--bd2);border-radius:8px;padding:14px 18px;color:var(--tx);font-size:13.5px;line-height:1.5;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fpd-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}.fpd-ic{font-size:28px}.fpd-h b{color:#fff;font-size:15px;display:block}.fpd-h small{color:var(--tx2)}
#fpDialog p{margin:4px 0}.fpd-f{color:var(--tx2);font-size:11px;margin-top:8px}

#fpHelp h3{color:#fff;margin-bottom:10px;letter-spacing:.08em;font-size:14px;text-transform:uppercase}.help-grid{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12.5px}.help-grid b{color:var(--ac)}#fpHelp p{margin-top:10px;color:var(--tx2);font-size:12px}
body.fp #topbar,body.fp #toolbar,body.fp #toolpanel,body.fp #rightpanel,body.fp #bottombar,body.fp #rpToggle,body.fp #tpToggle,body.fp #bbToggle,body.fp #hoverInfo,body.fp #fx{display:none!important}
body.fp #notifications{z-index:49;right:14px;top:180px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.chip{padding:3px 8px;border:1px solid var(--bd);border-radius:10px;font-size:10.5px;color:var(--tx2);cursor:pointer;background:rgba(255,255,255,.03);white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.08);color:#fff}.chip.on{border-color:var(--ac);color:#fff;background:rgba(90,169,230,.2)}
.trait{display:inline-block;padding:1px 6px;margin:2px 3px 0 0;border-radius:3px;font-size:10px;background:rgba(176,140,255,.18);color:#d8c8ff}.trait.bad{background:rgba(230,90,90,.18);color:#f0b0b0}
.bst h5{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin:8px 0 4px;font-weight:600}
#rpTabs button{font-size:9.5px}
/* ---- fit-to-screen: fluid panels, no overflow on small viewports ---- */
html,body{width:100%;height:100dvh}
#topbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;max-width:100vw}
#topbar>*{flex-shrink:0}#topbar .spacer{flex-shrink:1;min-width:4px}
#toolpanel{width:clamp(220px,24vw,296px);max-height:calc(100dvh - 240px)}
#rightpanel{width:clamp(220px,24vw,300px);max-height:calc(100dvh - 240px)}
#toolbar{max-height:calc(100dvh - 240px)}
#bottombar{height:clamp(110px,20dvh,170px);max-width:100vw}
#bottombar>div{min-width:0;min-height:0}
#minimapWrap{width:clamp(150px,20vw,230px);flex-shrink:0}

/* ---- light blue / silver brushed-metal theme, square corners, screw heads ---- */
:root{

function cityGeo(w,x,y){const n=w.n;let coastal=false,river=false,lake=false;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=n||Y>=n)continue;const i=Y*n+X;if(w.elev[i]<0){if(Math.abs(dx)<=2&&Math.abs(dy)<=2)coastal=true;}if(w.river[i]===1)river=true;else if(w.river[i]===2)lake=true;}

function genCityName(rng,info){info=info||{};const race=info.race||'human',g=info.geo||{};const P=RACE_SYL[race]||RACE_SYL.human;

 let stem=npick(rng,P.pre);let mid=npick(rng,P.mid);if(mid.toLowerCase()===stem.toLowerCase())mid=npick(rng,P.mid);stem+=mid.toLowerCase();
 let suf='';if(nchance(rng,0.55)){if(race==='dwarf')suf=npick(rng,['hold','forge','deep','helm','mine','gate','delve']);else if(race==='elf')suf=npick(rng,['riel','wen','lor','thil','mir','haven','wood']);else if(race==='orc')suf=npick(rng,['gash','bash','maul','fang','pit','horde']);else suf=npick(rng,CITYSUF);}

const BASE_TPS=4,MAX_TICKS=10;
// Top-right performance HUD: rolling frame/sim/render timings, updated ~4x/sec.
const Perf={frameMs:0,simMs:0,renderMs:0,_f:0,_s:0,_r:0,_n:0,_rn:0,_t:0};
function loop(now){const dt=Math.min(0.1,(now-lastT)/1000||0.016);lastT=now;const f0=performance.now();  if(W){if(!Sim.paused){Sim.acc+=dt*Sim.speed*BASE_TPS;let k=0;const t0=performance.now();const cap=Sim.hyper?40:Sim.speed>=1000?300:Sim.speed>=100?40:MAX_TICKS;while(Sim.acc>=1&&k<cap&&performance.now()-t0<34){if(Sim.hyper){if(Sim.acc<Hyper.DAYS)break;Hyper.tick(W);Sim.acc-=Hyper.DAYS;k++;}else{Sim.tick(W);Sim.acc--;k++;}}const maxDebt=Sim.speed*BASE_TPS*2;if(Sim.acc>maxDebt)Sim.acc=maxDebt;Perf._s+=performance.now()-t0;}
  if(now-Sim.tT>1000){Sim.tps=Sim.tcount;Sim.tcount=0;Sim.tT=now;}
  if(W.settings.dayNight&&!Sim.paused&&!Sim.hyper)W.dayPhase=(W.dayPhase+dt*Math.min(Sim.speed,3)/45)%1;
  Input.frame(dt);Cam.update(dt);Particles.tick(Sim.paused?0:dt);
  // at high speeds most frames go to simulation: render every 2nd/3rd frame so ticks, not pixels, get the budget
  Sim._rs=(Sim._rs||0)+1;const rskip=Sim.paused?1:(Sim.hyper||Sim.speed>=1000)?3:Sim.speed>=100?2:1;
  if(Sim._rs%rskip===0){const r0=performance.now();R.updateChunks(W);R.draw(W,dt*rskip,now);Minimap.draw(W,now);Perf._r+=performance.now()-r0;Perf._rn++;}
  Perf._f+=performance.now()-f0;Perf._n++;
  if(now-Perf._t>250&&Perf._n>0){Perf.frameMs=Perf._f/Perf._n;Perf.simMs=Perf._s/Perf._n;Perf.renderMs=Perf._r/Math.max(1,Perf._rn);Perf._f=0;Perf._s=0;Perf._r=0;Perf._n=0;Perf._rn=0;Perf._t=now;}
  UI.frame(now);}

  a.x=nx+0.5;a.y=ny+0.5;a.tx=a.x;a.ty=a.y;a.st='walking';},

 // ---------- explosives ----------

 // ---------- persistent entities ----------

   case 'vortex':{e.t--;e.ang=(e.ang||0)+0.4;const pull=(o,isH)=>{const dx=e.x-o.x,dy=e.y-o.y,d=Math.hypot(dx,dy);if(d>e.r)return;if(d<1){this.hurt(w,o,60,'swallowed by a vortex');return;}const s=0.5*(1-d/e.r)+0.15;o.x+=dx/d*s-dy/d*s*0.6;o.y+=dy/d*s+dx/d*s*0.6;o.tx=o.x;o.ty=o.y;};

 lifeStep(w,e){const S=e.size,g=e.grid,ng=new Uint8Array(S*S);let pop=0;

   case 'wb_pit':Tools.brush(wx,wy,(i,g)=>{const o=w.elev[i];w.setElev(i,o-60*g);lapse(i,o);w.veg[i]*=1-g;w.forest[i]*=1-g;if(w.elev[i]<0)toWater(i);else if(g>0.6){w.river[i]=2;w.water[i]=Math.max(w.water[i],20*g);w.biome[i]=B.LAKE;}});break;

 // ---------- god powers ----------
 god(sub,wx,wy){const w=W,r=T.size,amt=T.godAmt/100;const n=w.n;

   case 'wb_blood_rain':drops('200,20,30',6);if(once('blood',600))for(const civ of civsHere()){civ.params.aggr=clamp(civ.params.aggr+5,1,100);civ.stability-=2;}break;

   case 'wb_gamma_rain':{const all=Object.keys(WB_TRAITS);humans(h=>{if(Math.random()<0.08)this.addT(h,all[Math.floor(Math.random()*all.length)]);});drops('120,255,120');break;}

   case 'wb_mush':humans(h=>{if(!h.possessed&&Math.random()<0.15)this.convert(w,h,'Mush','mush spores');});Tools.brush(wx,wy,(i,g)=>{if(w.elev[i]>=0&&Math.random()<0.1*g){w.biome[i]=B.MUSHROOM;w.bioLock[i]=1;w.vegType[i]=BIOME_TREE[B.MUSHROOM];}});drops('200,120,120');break;

   case 'wb_rage':if(once('rage',1000))for(const civ of civsHere()){civ.params.aggr=clamp(civ.params.aggr+15,1,100);civ.stability-=8;const me=w.cityById(civ.capital);let tgt=null,bd=1e9;for(const o of w.civs){if(!o.alive||o===civ||civ.wars.indexOf(o.id)>=0)continue;const oc=w.cityById(o.capital);if(oc&&me){const d=Math.hypot(oc.x-me.x,oc.y-me.y);if(d<bd){bd=d;tgt=o;}}}if(tgt){civ.wars.push(tgt.id);tgt.wars.push(civ.id);civ.lastWar=tgt.lastWar=w.time.tick;civ.relations[tgt.id]=tgt.relations[civ.id]=-100;Events.log(`${civ.name} flies into a rage and declares war on ${tgt.name}`,me?me.x:wx,me?me.y:wy,'war',true);}}drops('255,60,40');break;
   case 'wb_spite':if(once('spite',800))for(const civ of civsHere()){for(const o of w.civs){if(o!==civ&&o.alive){civ.relations[o.id]=o.relations[civ.id]=clamp((civ.relations[o.id]||0)-50,-100,100);}}civ.allies=[];Events.log(`${civ.name} is filled with spite`,wx,wy,'war');}drops('140,60,160');break;
   case 'wb_discord':if(once('discord',800))for(const civ of civsHere()){civ.stability-=25;for(const id of civ.allies){const o=w.civById(id);if(o)o.allies=o.allies.filter(x=>x!==civ.id);}civ.allies=[];civ.trades=[];Events.log(`Discord tears ${civ.name} apart`,wx,wy,'war',true);}drops('120,60,60');break;
   case 'wb_friendship':if(once('friend',800))for(const civ of civsHere()){for(const o of w.civs){if(o===civ||!o.alive)continue;civ.relations[o.id]=o.relations[civ.id]=clamp((civ.relations[o.id]||0)+40,-100,100);if(civ.wars.indexOf(o.id)>=0&&Math.random()<0.7){civ.wars=civ.wars.filter(x=>x!==o.id);o.wars=o.wars.filter(x=>x!==civ.id);Events.log(`${civ.name} and ${o.name} make peace in friendship`,wx,wy,'civ',true);}}}drops('255,200,220');break;
   case 'wb_unity':if(once('unity',800))for(const civ of civsHere()){civ.stability=Math.min(100,civ.stability+30);}citiesHere(c=>{c.happy=Math.min(1,c.happy+0.1);});drops('255,255,200');break;
   case 'wb_inspiration':if(once('insp',800))for(const civ of civsHere()){civ.techPts+=(ERA_THRESH[Math.min(9,civ.era+1)]-ERA_THRESH[civ.era])*0.15;Events.log(`${civ.name} is inspired`,wx,wy,'tech');}humans(h=>{h.edu=Math.min(100,h.edu+5);});drops('255,240,120');break;
   case 'wb_coffee':humans(h=>{h.coffee=300;});citiesHere(c=>{c.prosperity=Math.min(1,(c.prosperity||0)+0.02);});drops('110,70,40');break;
   case 'wb_shield':if(once('shield',400))citiesHere(c=>{c.shield=w.time.tick+600;});break;
   case 'wb_powerup':humans(h=>{h.hp=100;this.addT(h,'strong');});animals(a=>{a.hp=100;a.en=100;a.big=1.5;});drops('255,90,90',3);break;
   case 'wb_divine_light':humans(h=>{h.hp=100;h.sick=0;h.mad=false;});animals(a=>{const s=SPECIES[a.sp];if(s.undead||s.abil&&s.abil.has('infect'))Animals.kill(w,a,'purged by divine light');else{a.hp=100;}});Tools.brush(wx,wy,(i,g)=>{if(w.fire[i]>0){w.fire[i]=0;w.fireCells.delete(i);}w.poll[i]*=1-0.3*g;});this.spark(wx,wy,[255,250,200],8,0.5);break;

   case 'wb_finger':humans(h=>{if(Math.hypot(h.x-wx,h.y-wy)<1.2)this.hurt(w,h,100,'poked by the finger of god');else{h.x+=(h.x-wx)*0.3;h.y+=(h.y-wy)*0.3;}});animals(a=>{const s=SPECIES[a.sp];if(s.size<1&&Math.hypot(a.x-wx,a.y-wy)<1.2)this.hurt(w,a,100,'poked by the finger of god');else{a.x+=(a.x-wx)*0.3;a.y+=(a.y-wy)*0.3;a.tx=a.x;a.ty=a.y;}});break;

     for(const e of got){e.dead=true;e.lifted=true;}this.magnet=got;UI.toast(got.length?`Picked up ${got.length} creatures. Click again to drop them.`:'Nothing to pick up here');}

 // ---------- drawing ----------
 drawWorld(ctx,w,z,now){
  for(const e of this.ents){
   if(e.type==='tnt'){ctx.fillStyle='#b02020';ctx.fillRect(e.x-0.3,e.y-0.3,0.6,0.6);if((now/150|0)%2){ctx.fillStyle='#ffe060';ctx.fillRect(e.x-0.08,e.y-0.5,0.16,0.2);}}
   else if(e.type==='mine'){ctx.fillStyle='rgba(40,40,40,0.8)';ctx.beginPath();ctx.arc(e.x,e.y,0.3,0,6.283);ctx.fill();ctx.fillStyle=(now/400|0)%2?'#ff3030':'#601010';ctx.fillRect(e.x-0.06,e.y-0.06,0.12,0.12);}
   else if(e.type==='vortex'){for(let k=0;k<4;k++){ctx.strokeStyle=`rgba(${120+k*30},${90+k*20},200,${0.5-k*0.1})`;ctx.lineWidth=Math.max(0.15,2/z);ctx.beginPath();for(let s=0;s<=40;s++){const a=e.ang+k*1.57+s*0.3,rr=e.r*(1-s/40);s?ctx.lineTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr):ctx.moveTo(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr);}ctx.stroke();}}
   else if(e.type==='goo'){ctx.fillStyle='rgba(150,150,165,0.75)';let k=0;for(const i of e.cells){if(k++>5000)break;ctx.fillRect(i%w.n,i/w.n|0,1,1);}}
   else if(e.type==='conway'){ctx.fillStyle='rgba(120,255,200,0.75)';const S=e.size;for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(e.grid[y*S+x])ctx.fillRect(e.x0+x+0.1,e.y0+y+0.1,0.8,0.8);ctx.strokeStyle='rgba(120,255,200,0.25)';ctx.lineWidth=Math.max(0.05,1/z);ctx.strokeRect(e.x0,e.y0,S,S);}}
  for(const c of w.cities){if(c.shield>w.time.tick&&c.state==='alive'){const r=3+c.level*2+1;ctx.strokeStyle=`rgba(140,200,255,${0.5+0.2*Math.sin(now*0.005)})`;ctx.lineWidth=Math.max(0.15,2/z);ctx.beginPath();ctx.arc(c.x+0.5,c.y+0.5,r,0,6.283);ctx.stroke();ctx.fillStyle='rgba(140,200,255,0.08)';ctx.fill();}}
  for(const f of this.fx){if(f.type==='beam'){const a=1-f.t/f.dur;ctx.strokeStyle=`rgba(${f.col},${a.toFixed(2)})`;ctx.lineWidth=Math.max(0.12,2.5/z);ctx.beginPath();ctx.moveTo(f.x1,f.y1);ctx.lineTo(f.x2,f.y2);ctx.stroke();}}
  if(this.magnet.length&&Input.hover){ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font=`${Math.max(0.6,12/z)}px system-ui`;ctx.fillText(`🧲 ${this.magnet.length}`,Input.hover[0]+0.6,Input.hover[1]-0.6);}},

 drawCreature(ctx,a,s,z){const big=a.big||1;const sz=(0.16+s.size*0.12)*big;const t=performance.now()*0.008+a.id;ctx.save();ctx.translate(a.x,a.y);ctx.strokeStyle='rgba(0,0,0,0.55)';ctx.lineWidth=0.04;
  const body=(col)=>{ctx.fillStyle=col;};
  switch(s.shape){
   case 'humanoid':{const bob=Math.sin(t)*0.02;ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(-sz*0.5,sz*1.1,sz,sz*0.18);body(s.col);ctx.fillRect(-sz*0.42,-sz*0.4+bob,sz*0.84,sz*1.1);ctx.beginPath();ctx.arc(0,-sz*0.75+bob,sz*0.38,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle='#200';ctx.fillRect(-sz*0.18,-sz*0.82+bob,sz*0.1,sz*0.1);ctx.fillRect(sz*0.08,-sz*0.82+bob,sz*0.1,sz*0.1);if(s.ranged){ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(sz*0.5,-sz*0.6);ctx.lineTo(sz*0.6,sz*0.6);ctx.stroke();}break;}
   case 'skull':ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(0,0,sz*0.7,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.fillRect(-sz*0.35,-sz*0.2,sz*0.25,sz*0.25);ctx.fillRect(sz*0.1,-sz*0.2,sz*0.25,sz*0.25);if(s.fireproof){ctx.fillStyle='rgba(255,140,40,0.7)';ctx.beginPath();ctx.moveTo(-sz*0.5,-sz*0.5);ctx.lineTo(0,-sz*(1.3+Math.sin(t)*0.2));ctx.lineTo(sz*0.5,-sz*0.5);ctx.fill();}break;
   case 'blob':{const sq=1+Math.sin(t)*0.1;ctx.fillStyle=s.col;ctx.beginPath();ctx.ellipse(0,0,sz*0.8*sq,sz*0.6/sq,0,0,6.283);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-sz*0.3,-sz*0.25,sz*0.18,sz*0.18);ctx.fillRect(sz*0.12,-sz*0.25,sz*0.18,sz*0.18);break;}

//  8-BIT SPRITES (2D map)
//  Animals, people, monsters, buildings and trees are rasterised once on a

 // ---- monster shapes ----
 g_blob(s,p,f){const sz=Math.sqrt(s.size);const r=3+sz*2.2;const g=new PXG(Math.ceil(r*2)+4,Math.ceil(r*1.7)+4);const cx=g.w/2,cy=g.h-2-r*0.75*(f?0.92:1);

   case 'shrub':case 'fruit':{g=new PXG(11,8);canopy(g,5.5,4.5,4.2,2.8,v*13);if(k==='fruit'){for(let q=0;q<5;q++)g.set(2+Math.floor(hashI(v+q*3)*7),2+Math.floor(hashI(v+q*5)*4),q%2?P_X:P_R);}break;}
   case 'mushroom':{g=new PXG(15,17);const yb=15;g.rect(6,7,3,yb-6,P_W);g.rect(8,7,1,yb-6,P_H);g.ell(7.5,6,6.5,3.6,P_X);g.recolor(P_X,P_B);for(const [x,y] of [[4,4],[8,3],[11,5],[6,6]])g.set(x,y,P_W);g.shade(P_B,P_BL,P_BD);break;}

// trees, crops and ground cover as pixel sprites
R.drawTrees=function(ctx,w,vx0,vy0,vx1,vy1,z,cells){const n=w.n,season=w.season();ctx.imageSmoothingEnabled=z<11;
 // keep trees off town plots
 const built=new Set();for(const c of w.cities){if(c.x<vx0-12||c.x>vx1+12||c.y<vy0-12||c.y>vy1+12)continue;for(const p of this.cityPlots(w,c))built.add((c.y+p.dy)*n+c.x+p.dx);}
const dense=z>=11&&cells<14000;const props=z>=10&&cells<16000;
 for(let y=vy0;y<=vy1;y++)for(let x=vx0;x<=vx1;x++){const i=y*n+x;if(w.lava[i]>0||w.isWater(i)||built.has(i))continue;const f=w.forest[i],vt=w.vegType[i];
  // hillside fit: trees stay off cliffs and thin out on steep slopes so they
  // sit on the hill instead of floating over rock faces
  const e0=w.elev[i];let slp=0;if(x>0)slp=Math.max(slp,Math.abs(e0-w.elev[i-1]));if(x<n-1)slp=Math.max(slp,Math.abs(e0-w.elev[i+1]));if(y>0)slp=Math.max(slp,Math.abs(e0-w.elev[i-n]));if(y<n-1)slp=Math.max(slp,Math.abs(e0-w.elev[i+n]));
  const cliff=slp>150,steep=slp>80;
  if(cliff)continue;
  // clumped spacing: patch noise makes groves vs gaps so forests feel vast, not uniform
  const patch=hashI((x>>2)*73+(y>>2)*191);const gap=hashI((x>>1)*37+(y>>1)*101+i%7);
  if(f>0.12){if(patch<0.1&&f<0.4)continue;if(gap<0.06)continue;
   const cnt=steep?1:(dense?(patch>0.5?3+(f*2|0):2):(patch>0.6?2:1));if(!cnt)continue;const burnt=w.burnt[i]>0.55,snow=w.snow[i]>0.45;
   for(let k=0;k<cnt;k++){const hx=hashI(i*7+k*13),hy=hashI(i*11+k*17);const px=x+0.05+hx*0.9,py=y+0.3+hy*0.65;const spr=PXT.sprite(vt||1,(i+k)%3,season,snow,burnt);const tsc=(0.85+f*0.45)*(0.8+hashI(i*13+k*29)*0.4)*OBJ_S;PX.blit(ctx,spr,px,py,hashI(i+k*3)<0.5,tsc);}}
  else if(props&&w.veg[i]>0.3){if(gap<0.3)continue;const h=hashI(i*19);if(vt===9){PX.blit(ctx,PXT.sprite(9,0,season,false,false),x+0.5,y+0.85,false,0.6*OBJ_S);}else if(vt===10||vt===11||vt===12||vt===VT_FRUIT){if(h<0.45)PX.blit(ctx,PXT.sprite(vt,i%3,season,w.snow[i]>0.45,false),x+0.3+hashI(i*5)*0.4,y+0.7+hashI(i*3)*0.25,h<0.3,0.6*OBJ_S);}
   else if(h<0.25&&w.snow[i]<0.4)PX.blit(ctx,PXT.sprite(8,0,season,false,false),x+0.2+hashI(i*5)*0.6,y+0.4+hashI(i*9)*0.5,h<0.17,0.6*OBJ_S);}
  if(z>=10&&w.resType[i]&&w.resAmt[i]>0&&hashI(i*23)<0.6)PX.blit(ctx,PXF.rock(i%2,RESOURCES[w.resType[i]].c),x+0.5,y+0.7,false,OBJ_S);}};

// Global 8-bit sprite scale for 2D map icons (creatures, trees, walls, props).
const OBJ_S=0.26;
// Plot-space scale: plot layout is shared with the 3D builders, so it stays
// on the old base and never changes — rendering scales up, plots don't move.
const PLOT_S=0.17;
// 2D-only city building scale/spread. Buildings render bigger to match map scale;
// the shared plot data and all 3D builders are untouched so 3D stays scaled down.
const CITY_S=0.40,CITY_SPREAD=1.3;
R.cityPlots=function(w,c){if((c.robotic||0)>0.1&&c.state==='alive'){const plots=[];for(let dy=-8;dy<=8;dy+=4)for(let dx=-8;dx<=8;dx+=4){const x=c.x+dx,y=c.y+dy;if(!w.inB(x,y)||w.isWater(y*w.n+x)||w.owner[y*w.n+x]!==c.civ)continue;const k=(dy+8)/4*5+(dx+8)/4;plots.push({x:x+0.5,y:y+0.92,k,hs:hashI(c.id*31+k),dx,dy,center:dx===0&&dy===0});}return plots;}
 const key=`v3|${c.level}|${Math.round(c.pop/200)}|${c.state}|${c.damage>0.3?1:0}`;if(c._px&&c._px.key===key&&c._px.n===w.n)return c._px.plots;const n=w.n;
 const rad=(1.3+c.level*1.5)*1.55*PLOT_S+0.35,R0=Math.ceil(rad),seed=c.id*31;const cand=[];for(let dy=-R0;dy<=R0;dy++)for(let dx=-R0;dx<=R0;dx++){const d=Math.hypot(dx,dy);if(d>rad)continue;const x=c.x+dx,y=c.y+dy;if(!w.inB(x,y))continue;const i=y*n+x;if(w.elev[i]<0||w.river[i]===2)continue;cand.push([dx,dy,d+hashI(seed+dx*17+dy*31)*1.2]);}
 cand.sort((a,b)=>a[2]-b[2]);const count=Math.min(cand.length,c.state!=='alive'?Math.min(18,5+c.level*4):Math.min(170,5+c.level*14+Math.round(c.pop/200)));const plots=[];
 for(let k=0;k<count;k++){const [dx,dy]=cand[k];const hs=hashI(seed+k*7);plots.push({x:c.x+dx+0.5+(hs-0.5)*0.45,y:c.y+dy+0.92,k,hs,dx,dy,center:k===0});}
 plots.sort((a,b)=>a.y-b.y);c._px={key,plots,n:w.n};return plots;};
// stroke a straight road keeping off water: only dry spans are painted
R.dryLine=function(ctx,w,x0,y0,x1,y1){const n=w.n,L=Math.hypot(x1-x0,y1-y0),steps=Math.max(2,Math.ceil(L/0.25));let open=false;ctx.beginPath();
 for(let s=0;s<=steps;s++){const t=s/steps,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;const xi=clamp(x|0,0,n-1),yi=clamp(y|0,0,n-1);
  if(w.isWater(yi*n+xi)){open=false;continue;}

  bar.innerHTML='<span class="vh">3D WORLD · drag rotate · shift/right-drag pan · scroll zoom · click uses the map tool</span><button id="v3dQ" title="Cycle render quality: speed vs beauty">⚙ Balanced</button><button id="v3dReset">⟲ Reset view</button><button id="v3dTop">⤓ Top-down</button><button id="v3dExit">✕ Exit (Esc)</button>';
  document.body.appendChild(bar);this.bar=bar;
  bar.querySelector('#v3dExit').onclick=()=>this.exit();
  bar.querySelector('#v3dReset').onclick=()=>this.center();
  bar.querySelector('#v3dTop').onclick=()=>{this.g.pitch=1.45;};
  this.qBtn=bar.querySelector('#v3dQ');
  this.qBtn.onclick=()=>{const order=['smooth','balanced','cinematic'];const cur=this.qMode||'balanced';this.applyQ(order[(order.indexOf(cur)+1)%order.length]);};
  const b=document.createElement('button');b.id='btn3d';b.className='btn sm';b.textContent='🌐 3D WORLD (V)';b.title='View the world as a rotatable 3D model (V)';
  const anchor=document.getElementById('btnExport');if(anchor&&anchor.parentElement)anchor.parentElement.insertBefore(b,anchor);else{const tb=document.getElementById('topbar');if(tb)tb.appendChild(b);}
  b.onclick=()=>this.toggle();this.btn=b;},
};
VIEW3D.init();

// fetch the 3D engine in the background so the first possession starts quickly
setTimeout(()=>{if(window.WebGL2RenderingContext)TV.imports().catch(()=>{});},3000);

// 3D quality options in the possession settings (F2) and the Possess panel
{const _res=UI.resolve;UI.resolve=function(path){const [o,k]=path.split('.');if(o==='TVQ')return [TV.Q,k];return _res.call(this,path);};}
{const _in=UI.onInput;UI.onInput=function(e){_in.call(this,e);const b=e.target.dataset.b||'';if(b==='TVQ.grass'&&TV.Veg)TV.Veg.lastG=null;if(b==='TVQ.pr'&&TV.r){TV.r.setPixelRatio(TV.Q.pr);TV.resize();}if(b==='TVQ.shadows'&&TV.r){TV.r.shadowMap.enabled=!!TV.Q.shadows;TV.r.shadowMap.needsUpdate=true;TV.scene.traverse(o=>{if(o.material)o.material.needsUpdate=true;});}if(b==='TVQ.bloom'&&TV.comp&&TV.bloom){const ps=TV.comp.passes,ix=ps.indexOf(TV.bloom);if(TV.Q.bloom&&ix<0)ps.splice(1,0,TV.bloom);if(!TV.Q.bloom&&ix>=0)ps.splice(ix,1);}if(b==='TVQ.exposure'&&TV.r)TV.r.toneMappingExposure=TV.Q.exposure;if(b.startsWith('TVQ.')){if(TV.gov)TV.gov.lvl=5;if(typeof GFXQ!=='undefined')GFXQ.current='custom';}};}
TV.settingsHTML=function(){return UI.sec('3D Graphics',`<div class="hint">${TV.ok?'three.js renderer':TV.failed?'three.js could not load (offline?), so the basic renderer is used.':'three.js loads the first time you possess a creature.'}</div>`+UI.sl('TVQ.clouds','Volumetric cloud quality',0,64,2)+UI.sl('TVQ.grass','Grass blades',0,40000,500)+UI.sl('TVQ.pr','Resolution scale',0.5,2,0.05,'x')+UI.tg('TVQ.shadows','Dynamic shadows')+UI.tg('TVQ.bloom','Bloom shader')+UI.sl('TVQ.msaa','MSAA anti-aliasing',0,8,1)+UI.sl('TVQ.shadow','Shadowmap size',512,4096,256)+UI.sl('TVQ.exposure','Exposure',0.4,1.6,0.05,'x')+`<div class="hint">MSAA and shadowmap size apply on next possess.</div>`,false);};
{const _os=FP.openSettings;FP.openSettings=function(){_os.call(this);const b=$('modalBody');if(b)b.insertAdjacentHTML('beforeend',TV.settingsHTML());};}

// ============================================================
//  SPLIT SCREEN: the map and every tool on the left, the possessed
//  creature's 3D view on the right. B toggles it; drag the divider to
//  resize. Click the 3D side to take control (mouse look, WASD); press
//  Esc to hand the keyboard and mouse back to the map and tools.
// ============================================================
const SPLIT={on:false,frac:0.5,
 w2d(){if(typeof VIEW3D!=='undefined'&&VIEW3D.on)return innerWidth;return this.on&&typeof FP!=='undefined'&&FP.active?Math.round(innerWidth*this.frac):innerWidth;},
 rect(){if(typeof VIEW3D!=='undefined'&&VIEW3D.on)return {x:0,y:0,w:innerWidth,h:innerHeight};if(this.on&&FP.active){const x=this.w2d();return {x,y:42,w:innerWidth-x,h:innerHeight-42};}return {x:0,y:0,w:innerWidth,h:innerHeight};},
 toggle(){if(!FP.active){this.on=!this.on;this.save();UI.toast(this.on?'Split screen on: it opens when you possess a creature (select one, press G)':'Split screen off');return;}
  this.on=!this.on;this.save();if(this.on&&document.pointerLockElement)document.exitPointerLock();this.apply();if(this.on){Cam.follow=FP.ent;Cam.tz=Math.max(Cam.tz,10);Sel.set(FP.isHuman?'human':'animal',FP.ent);}UI.toast(this.on?'Split screen: click the 3D side to control, Esc to use the map':'Split screen off');},
 save(){try{localStorage.setItem('wgs_split',this.on?'1':'0');}catch(e){}},
 apply(){const sp=this.on&&FP.active;document.body.classList.toggle('fpsplit',sp);if(FP.active)document.body.classList.toggle('fp',!sp);else document.body.classList.remove('fp');
  document.documentElement.style.setProperty('--sp',this.w2d()+'px');this.bar.style.display=FP.active?'flex':'none';const vr=this.rect();this.bar.style.left=(vr.x+14)+'px';this.bar.style.top=(vr.y+44)+'px';
  this.btn.textContent=sp?'⧉ Full 3D (B)':'⧉ Split screen (B)';R.resize();if(typeof FX!=='undefined'&&FX.cv)FX.cv.style.width=this.w2d()+'px';if(FP.active&&FP.cv)FP.resize();},
 init(){const st=document.createElement('style');st.textContent=`
  body.fpsplit #rightpanel{right:calc(100vw - var(--sp) + 8px);width:250px}body.fpsplit #rpToggle{right:calc(100vw - var(--sp) + 8px)}
  body.fpsplit #bottombar{right:calc(100vw - var(--sp) + 8px)}body.fpsplit #bbToggle{left:calc(var(--sp) / 2)}body.fpsplit #notifications{right:calc(100vw - var(--sp) + 266px);width:220px}
  body.fpsplit #fpPrompt,body.fpsplit #fpDialog,body.fpsplit #fpHelp{left:calc(var(--sp) + (100vw - var(--sp)) / 2)}body.fpsplit #fpDialog{width:min(520px,44vw)}body.fpsplit #fpHelp{width:min(560px,46vw)}
  body.fpsplit #fx{width:var(--sp)!important}
  #splitBar{position:fixed;z-index:49;display:none;gap:6px}#splitBar button{background:rgba(10,14,20,.72);border:1px solid var(--bd2);color:#fff;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}#splitBar button:hover{border-color:#e6a35a}
  #splitDiv{position:fixed;top:42px;bottom:0;left:calc(var(--sp) - 3px);width:6px;background:linear-gradient(90deg,#0a0e14,#3a4456,#0a0e14);z-index:47;display:none;cursor:col-resize}body.fpsplit #splitDiv{display:block}`;
  document.head.appendChild(st);
  const bar=document.createElement('div');bar.id='splitBar';bar.innerHTML='<button id="spToggle"></button><button id="spFollow">📍 Find on map</button><button id="spLetGo">✕ Let go (G)</button>';document.body.appendChild(bar);this.bar=bar;this.btn=bar.querySelector('#spToggle');
  this.btn.onclick=()=>this.toggle();bar.querySelector('#spLetGo').onclick=()=>FP.exit();bar.querySelector('#spFollow').onclick=()=>{if(!FP.ent)return;if(!this.on)this.toggle();Cam.follow=FP.ent;Cam.tz=Math.max(Cam.tz,14);};
  const dv=document.createElement('div');dv.id='splitDiv';document.body.appendChild(dv);let drag=false;dv.addEventListener('pointerdown',e=>{drag=true;dv.setPointerCapture(e.pointerId);});dv.addEventListener('pointermove',e=>{if(!drag)return;this.frac=clamp(e.clientX/innerWidth,0.25,0.75);this.apply();});dv.addEventListener('pointerup',()=>{drag=false;});
  try{this.on=localStorage.getItem('wgs_split')==='1';}catch(e){}
  window.addEventListener('resize',()=>{if(FP.active)this.apply();});},
};

{const _px=UIX.possess;UIX.possess=function(){return _px.call(this).replace('<button class="btn pri" data-act="possess"','<button class="btn" data-act="splitToggle" style="width:100%;margin-bottom:6px">⧉ Split screen: map + 3D (B) — '+(SPLIT.on?'on':'off')+'</button><button class="btn pri" data-act="possess"');};}
